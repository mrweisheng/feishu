# ========================================================================
# 知识库管理页反向代理 —— knowledge.eazycar.top
#
# 用法(服务器上):
#   1. cp deploy/nginx-knowledge.conf /etc/nginx/conf.d/knowledge.conf
#      (Debian/Ubuntu 用 sites-available + 软链的,照你现有项目的方式放)
#   2. nginx -t && nginx -s reload
#   3. 签 HTTPS:certbot --nginx -d knowledge.eazycar.top
#      (会自动补 443 server 块和 80 跳转,其余不用动)
#
# 完整步骤见同目录《部署指南.md》。
# ========================================================================

server {
    listen 80;
    server_name knowledge.eazycar.top;

    # ---- 管理页(单文件 HTML) ----
    # 页面本身无数据,登录界面在前端;登录/数据全走 /api/knowledge/*,所以两条 location 必须都配
    location /admin {
        proxy_pass http://127.0.0.1:4111;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 知识库 API(含登录 /logout /session) ----
    location /api/knowledge/ {
        proxy_pass http://127.0.0.1:4111;
        proxy_set_header Host $host;
        # X-Real-IP 必须传:服务的登录限流(连错 5 次锁 2 分钟)按此识别来源 IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 录入长文触发批量嵌入、试搜偶发偏慢,超时放宽
        proxy_read_timeout 60s;
    }

    # ---- 其余路径一律 404(刻意的) ----
    # 同一进程还挂着 /api/messages(全部群聊归档)、/api/customer-leads(全部客资)、
    # /api/agents(Mastra)等**无鉴权**接口,整个应用代理出去等于把它们也公开。
    location / {
        return 404;
    }
}
